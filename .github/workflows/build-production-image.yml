name: Build production image

# Builds the fork's Twenty image and publishes it to GHCR; the VPS pulls it with `twenty.sh update`
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # APP_VERSION must be semver and match the code, or the server refuses to start / mis-runs upgrades
      - name: Read Twenty version
        id: version
        run: |
          version=$(grep -oP "TWENTY_CURRENT_VERSION = '\K[^']+" \
            packages/twenty-server/src/engine/core-modules/upgrade/constants/twenty-current-version.constant.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
